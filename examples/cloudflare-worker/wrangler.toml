name = "soroban-sas-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-11-12"

# `worker-build` compiles the crate for `wasm32-unknown-unknown` and generates
# the JavaScript shim that `main` points at.
[build]
command = "cargo install -q worker-build --version ^0.1 && worker-build --release"

[vars]
# Soroban RPC endpoint the Worker queries.
RPC_URL = "https://soroban-testnet.stellar.org"
# Strkey id of the deployed SAS contract. Replace it with your own; the
# placeholder below is intentionally not a valid contract id.
SAS_CONTRACT_ID = "C_REPLACE_WITH_YOUR_SAS_CONTRACT_ID"

[observability]
enabled = true
