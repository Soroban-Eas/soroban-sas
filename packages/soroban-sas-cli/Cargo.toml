[package]
# Publishing requires maintainers to declare the project license first.
publish = false
name = "soroban-sas-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
clap = { version = "4.0", features = ["derive", "env"] }
ed25519-dalek = "2.0.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
soroban-sas-common = { path = "../soroban-sas-common" }
soroban-sas-sdk = { path = "../soroban-sas-sdk" }
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-strkey = "0.0.8"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Real contracts hosted in-process by the CLI end-to-end tests (#332).
sas = { path = "../../contracts/sas" }
schema-registry = { path = "../../contracts/schema-registry", features = ["testutils"] }
soroban-sas-indexer = { path = "../../contracts/indexer", features = ["testutils"] }
