[package]
# Publishing requires maintainers to declare the project license first.
publish = false
name = "soroban-sas-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23"
clap = { version = "4.0", features = ["derive", "env"] }
# Interactive terminal prompts (validators, confirmations) for the
# `schema wizard` command (#469). Default features off: the optional
# `editor`/`password` extras pull tempfile's getrandom 0.4 tree, which
# needs a newer cargo than this workspace's pinned toolchain.
dialoguer = { version = "0.12", default-features = false }
ed25519-dalek = "2.0.0"
hex = "0.4"
# TOML configuration file support for default RPC/network settings.
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
soroban-sas-common = { path = "../soroban-sas-common" }
soroban-sas-sdk = { path = "../soroban-sas-sdk" }
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-strkey = "0.0.8"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Deterministic transaction hashes for the end-to-end RPC host (#469).
sha2 = "0.10"
# Mock network client for unit testing the SDK (#333).
soroban-sas-sdk = { path = "../soroban-sas-sdk", features = ["testutils"] }
# Real contracts hosted in-process by the CLI end-to-end tests (#332).
sas = { path = "../../contracts/sas" }
schema-registry = { path = "../../contracts/schema-registry", features = ["testutils"] }
soroban-sas-indexer = { path = "../../contracts/indexer", features = ["testutils"] }
