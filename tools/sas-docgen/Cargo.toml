[package]
name = "sas-docgen"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.0", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
soroban-sas-common = { path = "../../packages/soroban-sas-common" }
soroban-sas-sdk = { path = "../../packages/soroban-sas-sdk" }
soroban-sdk = { workspace = true }
