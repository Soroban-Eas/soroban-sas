[package]
name = "soroban-sas-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22"
libfuzzer-sys = "0.4"
soroban-sas-common = { path = "../packages/soroban-sas-common" }
soroban-sas-sdk = { path = "../packages/soroban-sas-sdk" }
soroban-sas-cli = { path = "../packages/soroban-sas-cli" }
soroban-sdk = { version = "21.7.7", features = ["testutils"] }
soroban-sas-indexer = { path = "../contracts/indexer", features = ["testutils"] }
sas = { path = "../contracts/sas" }
schema-registry = { path = "../contracts/schema-registry" }
serde_json = "1.0"
stellar-strkey = "0.0.8"
sha2 = "0.10"

# ── Original targets ──────────────────────────────────────────────────────────

[[bin]]
name = "schema_fuzz"
path = "fuzz_targets/schema_fuzz.rs"
test = false
doc = false

[[bin]]
name = "typed_data_fuzz"
path = "fuzz_targets/typed_data_fuzz.rs"
test = false
doc = false

[[bin]]
name = "eip712_encode_fuzz"
path = "fuzz_targets/eip712_encode_fuzz.rs"
test = false
doc = false

[[bin]]
name = "xdr_decode_fuzz"
path = "fuzz_targets/xdr_decode_fuzz.rs"
test = false
doc = false

[[bin]]
name = "cli_json_fuzz"
path = "fuzz_targets/cli_json_fuzz.rs"
test = false
doc = false

[[bin]]
name = "indexer_chunking_fuzz"
path = "fuzz_targets/indexer_chunking_fuzz.rs"
test = false
doc = false

[[bin]]
name = "indexer_idempotency_fuzz"
path = "fuzz_targets/indexer_idempotency_fuzz.rs"
test = false
doc = false

[[bin]]
name = "cross_contract_registry_sas_fuzz"
path = "fuzz_targets/cross_contract_registry_sas_fuzz.rs"
test = false
doc = false

