# OSS-Fuzz project configuration for soroban-sas.
#
# OSS-Fuzz documentation: https://google.github.io/oss-fuzz/
# Rust-specific guide:
#   https://google.github.io/oss-fuzz/getting-started/new-project-guide/rust-lang/
#
# To integrate this project with OSS-Fuzz:
# 1. Fork https://github.com/google/oss-fuzz and add a directory
#    `projects/soroban-sas/` containing copies of the three files in this
#    directory (project.yaml, Dockerfile, build.sh).
# 2. Open a pull request against the OSS-Fuzz repository.
# 3. After the PR is merged, OSS-Fuzz will build and run fuzz targets
#    continuously, and report any crashes to the security contact below.

homepage: "https://github.com/Soroban-Eas/soroban-sas"
language: rust
primary_contact: "security@soroban-sas.example"
auto_ccs:
  - "security@soroban-sas.example"
main_repo: "https://github.com/Soroban-Eas/soroban-sas"

# OSS-Fuzz's Rust integration only supports libfuzzer + address sanitizer.
# Reference: https://google.github.io/oss-fuzz/getting-started/new-project-guide/rust-lang/
sanitizers:
  - address
fuzzing_engines:
  - libfuzzer
