[workspace]
members = [
    "packages/soroban-sas-common",
    "contracts/schema-registry",
    "contracts/sas",
    "contracts/indexer",
    "packages/soroban-sas-sdk",
    "packages/soroban-sas-schema-macro",
    "packages/soroban-sas-cli",
    "contracts/permissive-resolver",
    "contracts/token-gated-resolver",
    "contracts/multisig-resolver",
    "contracts/endorsement-resolver",
    "contracts/blacklist-resolver",
    "tools/prometheus-exporter",
    "contracts/cross-chain-verifier",
    "contracts/zk-verifier",
]
exclude = ["fuzz", "tools/gas-profiler"]
resolver = "2"

[package]
name = "soroban-sas-workspace"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
criterion = { workspace = true }
soroban-sas-common = { workspace = true }
soroban-sas-sdk = { path = "packages/soroban-sas-sdk" }
soroban-sdk = { workspace = true, features = ["testutils"] }
hex = "0.4"
stellar-strkey = "0.0.8"
ed25519-dalek = "2.0.0"
serde_json = "1"
sas = { path = "contracts/sas" }
schema-registry = { path = "contracts/schema-registry" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ureq = "2"

[[bench]]
name = "hashing_benchmark"
harness = false

[[bench]]
name = "attestations_benchmark"
harness = false

[[test]]
name = "integration"
path = "tests/integration/e2e_node_test.rs"

[workspace.lints.rust]
unexpected_cfgs = "allow"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true


[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.test]
panic = "unwind"

[workspace.dependencies]
soroban-sdk = "21.7.7"
criterion = { version = "0.5", features = ["html_reports"] }
soroban-sas-common = { path = "packages/soroban-sas-common" }

[workspace.lints.clippy]
new_without_default = "allow"

[portable]

[package.metadata.docs]
all-features = true
documentation = "https://soroban-sas.github.io/soroban-sas-sdk/"