[package]
# Publishing requires maintainers to declare the project license first.
publish = false
name = "soroban-sas-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
soroban-sas-common = { path = "../../packages/soroban-sas-common" }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[features]
testutils = ["soroban-sdk/testutils"]
