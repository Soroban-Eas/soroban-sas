[package]
# Publishing requires maintainers to declare the project license first.
publish = false
name = "sas"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
soroban-sas-common = { path = "../../packages/soroban-sas-common" }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# FROST threshold test-vector generation (#534): curve arithmetic over the
# Ed25519 group plus SHA-512-to-scalar reduction for the signing shares. Both
# are already in the workspace dependency graph via ed25519-dalek/soroban-sdk.
curve25519-dalek = { version = "4.1", features = ["digest"] }
ed25519-dalek = "2.0.0"
hex = "0.4"
sha2 = "0.10"
schema-registry = { path = "../schema-registry", features = ["testutils"] }
soroban-sas-indexer = { path = "../indexer", features = ["testutils"] }
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-strkey = "0.0.8"
