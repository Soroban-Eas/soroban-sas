name: Mutation Baseline

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4.1.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.83.0
          targets: wasm32-unknown-unknown
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Run mutation testing
        env:
          PKG: ${{ inputs.package }}
        run: |
          set +e
          cargo mutants -p "$PKG" --timeout-multiplier 3
          code=$?
          echo "cargo-mutants exit code: $code"
          if [ "$code" -eq 2 ] || [ "$code" -eq 3 ]; then exit 0; fi
          exit $code
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ inputs.package }}
          path: mutants.out
