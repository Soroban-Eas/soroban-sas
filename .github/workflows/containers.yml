name: Multi-architecture container images

on:
  pull_request:
    branches: [main]
    paths: ['docker/**', '.github/workflows/containers.yml', 'packages/**', 'tools/prometheus-exporter/**', 'Cargo.toml', 'Cargo.lock']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      packages: write
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [cli, exporter]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/soroban-eas/soroban-sas-${{ matrix.image }}
          tags: |
            type=ref,event=tag
      - name: Build AMD64 and ARM64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3
      - name: Sign by immutable manifest digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/soroban-eas/soroban-sas-${{ matrix.image }}@$DIGEST"
          cosign verify "ghcr.io/soroban-eas/soroban-sas-${{ matrix.image }}@$DIGEST" \
            --certificate-identity-regexp '^https://github.com/Soroban-Eas/soroban-sas/.github/workflows/containers.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
